# =============================================================================
# Risk Quantification Methodology (RQM) Data Model — NSI-Minimal Edition
# -----------------------------------------------------------------------------
# A focused, loadable schema for a single National Structure Inventory (NSI)
# parquet ingest, with first-class multiple-geometry support (ADR-geometry)
# preserved so that additional footprint sources (Microsoft Building
# Footprints, FEMA USA Structures) can be attached beside each NSI point
# without a schema break.
#
# Supersedes the hybrid data model's inventory / uncertainty / hazard / DDF /
# realization / exports / provenance / versioning surface for v0.1. Re-entry
# points for the deferred domains are documented in ADR-nsi-minimal.
#
# The previous full-coverage dictionary is preserved at data-dictionary-full.yaml
# for reference; diff against that file to see exactly what was deferred.
#
# Storage tier:
#   iceberg -> relational, versioned Iceberg (format-version 3) tables accessed
#              via Apache Sedona (Spark 4.1) for SQL, geometry (ST_*), and
#              batch ingest. Geometry columns use the native Iceberg v3
#              GEOMETRY type. All tables live in the `inventory` namespace
#              (rqm.inventory.<table>).
#
# Versioning (ADR-versioning): named inventory versions are Iceberg tags on
# buildings + geometries, registered in inventory_versions, with per-building
# changes in inventory_changes. Project inventories are Iceberg branches.
#
# Multiple sources (ADR-multi-source): NSI and other inventories (assessor
# rolls, field surveys, project inventories, ...) sit side by side in
# buildings, scoped by source_ref and registered in sources. The NSI field
# set is the shared column schema; each source maps onto it with a YAML spec.
# =============================================================================

metadata:
  model_name: Risk Quantification Methodology (RQM) Data Model — NSI Minimal
  version: 0.4.0
  companion_repo: fema-ffrd/inland-consequences
  storage_tiers: [iceberg]
  query_engine: Apache Sedona (Spark 4.1)
  domains: [inventory]

# -----------------------------------------------------------------------------
# ENUMERATIONS
# Inlined as varchar + CHECK/enum declaration. NSI already publishes stable
# short codes; no lookup table buys anything until per-code metadata (RSMeans
# rates, fragility curves) is needed — and adding a lookup is additive, not a
# schema break.
# -----------------------------------------------------------------------------
enums:
  occtype:
    # HAZUS occupancy classes used by NSI; not exhaustive but covers v0.1.
    - RES1          # Single-family
    - RES2          # Mobile home
    - RES3A         # Multi-family 2 units
    - RES3B         # Multi-family 3-4 units
    - RES3C         # Multi-family 5-9 units
    - RES3D         # Multi-family 10-19 units
    - RES3E         # Multi-family 20-49 units
    - RES3F         # Multi-family 50+ units
    - RES4          # Hotel / motel
    - RES5          # Institutional dorm
    - RES6          # Nursing home
    - COM1          # Retail trade
    - COM2          # Wholesale trade
    - COM3          # Personal / repair services
    - COM4          # Professional offices
    - COM5          # Bank
    - COM6          # Hospital
    - COM7          # Medical office / clinic
    - COM8          # Entertainment / recreation
    - COM9          # Theater
    - COM10         # Parking garage
    - IND1          # Heavy industrial
    - IND2          # Light industrial
    - IND3          # Food / drugs / chemicals
    - IND4          # Metals / mineral processing
    - IND5          # High technology
    - IND6          # Construction
    - AGR1          # Agriculture
    - GOV1          # General services
    - GOV2          # Emergency response
    - EDU1          # Schools
    - EDU2          # Colleges / universities
    - REL1          # Churches / non-profit
  st_damcat:
    - RES           # Residential
    - COM           # Commercial
    - IND           # Industrial
    - PUB           # Public
    - AGR           # Agricultural
  found_type:
    - S             # Slab on grade
    - C             # Crawlspace
    - B             # Basement
    - P             # Pier / post
    - F             # Fill / elevated
  geometry_role:
    - point
    - footprint
  geometry_purpose:
    - computation
    - hazard_sampling
    - display
    - qc
  version_kind:
    - release       # a new source dataset loaded in full
    - edit          # in-place edits, or a revised copy of the dataset
    - merge         # a branch merged into another branch
  change_kind:
    - added
    - removed
    - modified
  source_kind:
    # Kinds of building inventory (RQM-04: national, local, commercial, or
    # project-specific); enum of sources.source_kind.
    - national_inventory    # e.g. NSI
    - local_inventory       # county assessor, municipal building inventory
    - commercial_inventory  # vendor building / parcel datasets
    - project_inventory     # planned or study-specific structures
    - field_survey          # structures measured in the field
    - remote_sensing        # footprints or attributes derived from imagery / lidar
    - other

# -----------------------------------------------------------------------------
# DOMAIN A — INVENTORY  (NSI structures + first-class geometry)
# -----------------------------------------------------------------------------
tables:

  buildings:
    domain: inventory
    storage: iceberg
    grain: One row per structure per source inventory.
    description: >
      Flat inventory projection on the NSI field set. Every NSI parquet column
      maps 1:1 to a column on this table, using NSI's native field names
      (occtype, num_story, val_struct, pop2amu65, …) so queries line up with
      the raw source. Other inventories map onto the same columns through a
      YAML source spec (ADR-multi-source); their unmapped fields are NULL.
      Sources sit side by side, scoped by source_ref, so one physical
      structure can appear once per source — aggregates across sources
      double count. Geometry lives in the `geometries` table (ADR-geometry
      preserved). Component decomposition, attribute uncertainty specs,
      hazard links, DDFs, loss realizations, export contracts, provenance
      registry, and valid-time (bitemporal) history are deferred; re-entry
      points are documented in ADR-nsi-minimal. The primary key `building_id`
      is the NSI `fd_id` for NSI rows and a hash of (source_ref,
      source_record_id) for every other source, so ids are stable across
      re-ingests and versions. Loads MERGE a full replacement of one source
      into a branch; other sources are untouched, and earlier states stay
      readable through version tags (ADR-versioning). Physical layout: partitioned by state
      (Iceberg `truncate(2, cbfips)`) and sorted by `cbfips`; merge-on-read
      writes.
    columns:
      - {name: building_id,  type: bigint,       pk: true, nullable: false, description: 'Stable primary key (unique, asserted in smoke tests). NSI rows: the fd_id. Other sources: xxhash64(source_ref, source_record_id) with the sign bit set, so always negative and never equal to an NSI id.'}
      - {name: source_ref,   type: varchar(64),  fk: sources.source_ref, nullable: false, description: 'Inventory the row came from (NSI, COUNTY-ASSESSOR, ...). Loads replace only their own source''s rows. Rows written before the multi-source migration read as NSI.'}
      - {name: source_record_id, type: varchar(128), nullable: true, description: 'Native id of the structure in its source (RQM-04), as a string; NSI: the fd_id. Unique per source_ref.'}
      - {name: fd_id,        type: bigint,       nullable: true,  description: NSI structure id (external natural key; source of building_id for NSI rows; NULL for other sources unless they map it; logically UNIQUE where not null).}
      - {name: bid,          type: varchar(32),  nullable: true,  description: 'NSI building id (UBID — Open Location Code plus extents, e.g. 8645XMJC+QG9-2-2-3-1).'}
      - {name: usastrucid,   type: varchar(32),  nullable: true,  description: FEMA USA Structures id (joins to USAS footprint source).}
      - {name: ftprntid,     type: varchar(64),  nullable: true,  description: Footprint id as reported by NSI (joins to geometries.source_ref when the footprint source is attached).}
      - {name: ftprntsrc,    type: varchar(32),  nullable: true,  description: Footprint source tag (MSBF, USAS, ...).}
      - {name: source,       type: varchar(32),  nullable: true,  description: 'NSI per-structure source code (e.g., P, H); geometries.source_ref is NSI-<source>.'}
      - {name: occtype,      type: varchar(16),  nullable: false, description: Occupancy classification code (enum occtype; e.g., RES1, COM1).}
      - {name: st_damcat,    type: varchar(16),  nullable: true,  description: Structure damage category (enum st_damcat; RES, COM, IND, PUB, AGR).}
      - {name: bldgtype,     type: varchar(16),  nullable: true,  description: Construction class code (e.g., W1 wood light-frame, M1 masonry).}
      - {name: num_story,    type: smallint,     nullable: true,  description: Story count.}
      - {name: sqft,         type: double,       nullable: true,  description: Reported structure area, square feet.}
      - {name: ftprntsqft,   type: double,       nullable: true,  description: Footprint-derived area, square feet (may differ from sqft for multi-story structures).}
      - {name: bldheight,    type: real,         nullable: true,  description: Building height, feet.}
      - {name: med_yr_blt,   type: smallint,     nullable: true,  description: Median year built for the structure (or its block/cohort).}
      - {name: found_type,   type: varchar(16),  nullable: true,  description: Foundation type code (enum found_type; S slab, C crawlspace, B basement, P pier, F fill/elevated).}
      - {name: found_ht,     type: real,         nullable: true,  description: First-floor height above adjacent grade, feet.}
      - {name: val_struct,   type: double,       nullable: true,  description: Structure replacement value, USD.}
      - {name: val_cont,     type: double,       nullable: true,  description: Contents replacement value, USD.}
      - {name: val_vehic,    type: double,       nullable: true,  description: Vehicle value attributed to structure, USD.}
      - {name: ornl_low,     type: double,       nullable: true,  description: ORNL low-value estimate, USD (alternate value basis).}
      - {name: ornl_med,     type: double,       nullable: true,  description: ORNL median-value estimate, USD.}
      - {name: ornl_hgh,     type: double,       nullable: true,  description: ORNL high-value estimate, USD.}
      - {name: resunits,     type: real,         nullable: true,  description: Residential units contained in structure.}
      - {name: novehprob,    type: real,         nullable: true,  description: Probability that the household has no vehicle.}
      - {name: vehperunit,   type: real,         nullable: true,  description: Vehicles per residential unit.}
      - {name: pop2amu65,    type: real,         nullable: true,  description: 2 AM population, under 65 years old.}
      - {name: pop2amo65,    type: real,         nullable: true,  description: 2 AM population, 65 years old and over.}
      - {name: pop2pmu65,    type: real,         nullable: true,  description: 2 PM population, under 65 years old.}
      - {name: pop2pmo65,    type: real,         nullable: true,  description: 2 PM population, 65 years old and over.}
      - {name: u65disable,   type: real,         nullable: true,  description: Under-65 disabled population attributed to structure.}
      - {name: o65disable,   type: real,         nullable: true,  description: 65-and-over disabled population attributed to structure.}
      - {name: students,     type: real,         nullable: true,  description: Student population attributed to structure.}
      - {name: firmzone,     type: varchar(16),  nullable: true,  description: FIRM (Flood Insurance Rate Map) flood zone code.}
      - {name: zone_sub,     type: varchar(16),  nullable: true,  description: FIRM zone subtype / qualifier.}
      - {name: static_bfe,   type: real,         nullable: true,  description: Static base flood elevation, feet.}
      - {name: ground_elv,   type: real,         nullable: true,  description: Ground elevation at structure, feet.}
      - {name: grnd_elv_m,   type: real,         nullable: true,  description: Ground elevation at structure, meters.}
      - {name: pctlowclr,    type: real,         nullable: true,  description: NSI pctlowclr indicator (percent low-clearance).}
      - {name: fullrep,      type: real,         nullable: true,  description: NSI fullrep indicator (full-replacement flag or share).}
      - {name: depindex,     type: real,         nullable: true,  description: NSI dependency index.}
      - {name: creprcnt,     type: real,         nullable: true,  description: NSI community-resilience percent indicator.}
      - {name: crerank,      type: real,         nullable: true,  description: 'NSI community-resilience rank (fractional, 0-1).'}
      - {name: cbfips,       type: varchar(15),  nullable: true,  description: Census block GEOID (15-digit FIPS) for community-level aggregation.}
      - {name: x,            type: double,       nullable: true,  description: 'Longitude (WGS84) of the structure point, as NSI publishes it; derived from the computation point for sources that do not map it. Denormalized for query convenience.'}
      - {name: y,            type: double,       nullable: true,  description: 'Latitude (WGS84) of the structure point, as NSI publishes it; derived from the computation point for sources that do not map it. Denormalized for query convenience.'}
      - {name: ingested_at,  type: timestamp,    nullable: false, description: 'When this row was last written: its insert, or the last load or edit that changed it. Version history lives in Iceberg snapshots + inventory_versions.'}

  geometries:
    domain: inventory
    storage: iceberg
    grain: One row per (building, representation, alternate) geometric record.
    description: >
      First-class geometry registry (ADR-geometry preserved). Each row holds
      one geometric representation of a building. Every load produces
      exactly one row per structure with role='point',
      purpose='computation', is_selected_for_export=true (NSI: geom from the
      parquet `shape` column), stored as a native Iceberg v3 GEOMETRY with a
      column-level CRS of EPSG:3857; input in other CRSs is transformed.
      Polygon sources add a role='footprint', purpose='display' row, and
      their computation point is ST_PointOnSurface of the footprint
      (ADR-multi-source). Alternate footprints (MSBF, USAS)
      land as additional rows with role='footprint' and may flip the
      selected flag via a separate selection migration. Logical invariant:
      exactly one row per (building_id, purpose='computation') has
      is_selected_for_export=true at any time — enforced by the ingest script
      and smoke tests (Iceberg does not enforce UNIQUE). 3D roles,
      component-level geometry, and valid-time history are deferred (see
      ADR-nsi-minimal re-entry map). Versioned together with buildings
      (same tag per version). A reload never overwrites
      is_selected_for_export, deletes only its own source's missing rows,
      and deletes rows from any source whose building is gone. Physical layout: unpartitioned
      by default (configurable via TableLayout in tools/ingest_nsi.py);
      merge-on-read writes.
    columns:
      - {name: geometry_id,            type: bigint,       pk: true, nullable: false, description: 'Stable primary key: xxhash64 of the natural key (source_ref, building_id, role, purpose, alt_group_key), so a geometry keeps its id across re-ingests and selection changes. The ingest refuses a write whose id collides with a different natural key.'}
      - {name: building_id,            type: bigint,       fk: buildings.building_id, nullable: false, description: Parent structure (logical FK; cascade behavior enforced by the ingest contract).}
      - {name: role,                   type: varchar(16),  nullable: false, description: 'Geometry role (enum geometry_role): point | footprint. 3D roles deferred.'}
      - {name: purpose,                type: varchar(16),  nullable: false, description: 'Why this representation exists (enum geometry_purpose): computation | hazard_sampling | display | qc.'}
      - {name: is_selected_for_export, type: boolean,      nullable: false, description: Exactly one TRUE per (building_id, purpose='computation') at any time (logical invariant; asserted in smoke tests).}
      - {name: alt_group_key,          type: varchar(64),  nullable: true,  description: Groups competing alternates at the same (building_id, role) — e.g., two footprints from different sources share a key.}
      - {name: source_ref,             type: varchar(64),  nullable: true,  description: 'Source dataset that derived the geometry: the building''s sources.source_ref, or <source_ref>-<subcode> (NSI-P, NSI-H). Part of the geometry_id natural key.'}
      - {name: crs,                    type: varchar(16),  nullable: false, description: 'EPSG string for this row''s geometry; must equal the geom column CRS (EPSG:3857), so alternates are reprojected on load.'}
      - {name: geom,                   type: geometry,     nullable: false, description: 'Native Iceberg v3 GEOMETRY(EPSG:3857); Point for role=''point'', Polygon/MultiPolygon for role=''footprint''. Sedona reads it via ST_GeomFromWKB(spark_st_asbinary(geom)).'}
      - {name: ingested_at,            type: timestamp,    nullable: false, description: 'When this row was last written (insert, or a load that changed its point or CRS).'}

  sources:
    domain: inventory
    storage: iceberg
    grain: One row per source inventory (dataset lineage).
    description: >
      Registry of the inventories loaded into buildings (ADR-multi-source).
      A source_ref names a dataset lineage (NSI, COUNTY-ASSESSOR, ...) that
      stays the same across its releases; releases are told apart by version
      name and inventory_versions.source_uri. Upserted from the source's YAML
      mapping spec on every load, on main only (not versioned or branched),
      and never deleted, so every version's buildings.source_ref values
      resolve. The built-in NSI source is registered by the first NSI load
      (or by the schema migration of a pre-existing warehouse).
    columns:
      - {name: source_ref,  type: varchar(64),  pk: true, nullable: false, description: 'Source identifier; upper-case letters, digits, ".", "_", "-" (starts with a letter or digit). NSI is reserved for the built-in National Structure Inventory spec.'}
      - {name: source_name, type: varchar(200), nullable: false, description: Human-readable name.}
      - {name: source_kind, type: varchar(32),  nullable: false, description: 'Enum source_kind: national_inventory, local_inventory, commercial_inventory, project_inventory, field_survey, remote_sensing, or other.'}
      - {name: description, type: text,         nullable: true,  description: Free text.}
      - {name: spec_sha256, type: varchar(64),  nullable: true,  description: SHA-256 of the YAML mapping spec last used to load the source.}
      - {name: updated_at,  type: timestamp,    nullable: false, description: When the row was last written.}

  inventory_versions:
    domain: inventory
    storage: iceberg
    grain: One row per named inventory version.
    description: >
      Version registry (ADR-versioning). Each row names an immutable state of
      the inventory: `version_name` is also an Iceberg tag on `buildings` and
      `geometries` pointing at the recorded snapshots, so the version reads as
      `SELECT … FROM rqm.inventory.buildings VERSION AS OF '<version_name>'`.
      Records who committed it, why, from which input, on which branch, its
      lineage (parent and merged versions), and change counts relative to the
      parent. Written last when a version is committed, so a version exists
      only once registered; a tag without a row is an incomplete commit.
    columns:
      - {name: version_name,           type: varchar(100), pk: true, nullable: false, description: 'Version name; also the Iceberg tag name. Letters, digits, ".", "_", "-".'}
      - {name: parent_version,         type: varchar(100), fk: inventory_versions.version_name, nullable: true,  description: Version this one was derived from (NULL for a root load). For merges, the previous version of the target branch.}
      - {name: merged_version,         type: varchar(100), fk: inventory_versions.version_name, nullable: true,  description: 'For kind=merge: the branch version merged in.'}
      - {name: branch,                 type: varchar(100), nullable: false, description: Iceberg branch the version was committed on (main or a project branch).}
      - {name: kind,                   type: varchar(16),  nullable: false, description: 'Enum version_kind: release, edit, or merge.'}
      - {name: source_ref,             type: varchar(64),  fk: sources.source_ref, nullable: true, description: 'Source a release loaded (ADR-multi-source); NULL for edits, merges, and versions committed before multi-source support.'}
      - {name: source_uri,             type: text,         nullable: true,  description: Input file loaded for the version (NULL for in-place edits and merges).}
      - {name: source_sha256,          type: varchar(64),  nullable: true,  description: SHA-256 of the input file.}
      - {name: editor,                 type: varchar(100), nullable: false, description: Who committed the version (RQM-16).}
      - {name: reason,                 type: text,         nullable: true,  description: Why the version was committed (RQM-16).}
      - {name: buildings_snapshot_id,  type: bigint,       nullable: false, description: Iceberg snapshot of buildings tagged with version_name.}
      - {name: geometries_snapshot_id, type: bigint,       nullable: false, description: Iceberg snapshot of geometries tagged with version_name.}
      - {name: n_buildings,            type: bigint,       nullable: false, description: Buildings in the version.}
      - {name: n_added,                type: bigint,       nullable: false, description: Buildings added relative to parent_version (all of them for a root version).}
      - {name: n_removed,              type: bigint,       nullable: false, description: Buildings removed relative to parent_version.}
      - {name: n_changed,              type: bigint,       nullable: false, description: Buildings whose attributes or selected computation geometry changed relative to parent_version.}
      - {name: created_at,             type: timestamp,    nullable: false, description: When the version was committed (record time).}

  inventory_changes:
    domain: inventory
    storage: iceberg
    grain: One row per (version, building) added, removed, or modified relative to the version's parent.
    description: >
      Per-building change log (ADR-versioning), attributed through
      inventory_versions (editor, reason, created_at). Answers "which
      versions changed building X, how, and who did it" without scanning
      table history. Root versions have no rows; every building in them
      counts as added. Counts per version equal the registry's n_added /
      n_removed / n_changed.
    columns:
      - {name: version_name,    type: varchar(100),  pk: true, fk: inventory_versions.version_name, nullable: false, description: Version that made the change.}
      - {name: building_id,     type: bigint,        pk: true, fk: buildings.building_id, nullable: false, description: Changed building (logical FK; a removed building is absent from the head but present in earlier versions).}
      - {name: change_kind,     type: varchar(16),   nullable: false, description: 'Enum change_kind: added, removed, or modified.'}
      - {name: changed_columns, type: 'varchar[]', nullable: true, description: 'For modified rows: the buildings columns that changed, plus geom when the selected computation geometry changed.'}
